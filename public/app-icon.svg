<!-- App icon (npm run icons turns it into the home-screen, install and iPhone app icons; favicon.svg is the same in a circle). An abstract bench press that reads as Rerack: a barbell with an r on the left (its arm above the bar) and an upside-down r on the right (its foot at the bottom), mirroring each other. In the style of the Apple TV icon: white lettering that fades into a rainbow towards the bottom, a soft shading just inside the edges, a gentle glow behind, on a dark tile. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151516"/><stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="rainbow" gradientUnits="userSpaceOnUse" x1="176" y1="0" x2="848" y2="0">
      <stop offset="0" stop-color="#9a7bff"/><stop offset="0.25" stop-color="#5ec8ff"/><stop offset="0.45" stop-color="#5fe3a1"/>
      <stop offset="0.62" stop-color="#ffd25a"/><stop offset="0.8" stop-color="#ff8f6b"/><stop offset="1" stop-color="#ff8fc8"/>
    </linearGradient>
    <!-- The rainbow rises from the bottom: none at the top of the mark, full colour at its foot. -->
    <linearGradient id="rise" gradientUnits="userSpaceOnUse" x1="0" y1="340" x2="0" y2="690">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="url(#rise)"/>
    </mask>
    <!-- A thin gap in the letters where the bar crosses them. -->
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <path d="M236 440 H788" stroke="#000" stroke-width="84" stroke-linecap="round"/>
    </mask>
    <!-- Darkens just inside the edges, for the slightly raised, glassy look. -->
    <filter id="emboss" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feComposite in="SourceAlpha" in2="blur" operator="out" result="edge"/>
      <feFlood flood-color="#000" flood-opacity="0.24"/>
      <feComposite in2="edge" operator="in" result="shade"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/></feMerge>
    </filter>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#tile)"/>

  <!-- Glow: the coloured mark, blurred, behind. -->
  <g filter="url(#glow)" opacity="0.2">
    <g stroke="url(#rainbow)" fill="none" stroke-width="80" mask="url(#fade)">
      <path d="M312 728 V356 Q312 296 372 296 H458"/>
      <path d="M712 296 V668 Q712 728 652 728 H566"/>
    </g>
    <g fill="url(#rainbow)" mask="url(#fade)">
      <rect x="176" y="350" width="60" height="180" rx="18"/>
      <rect x="788" y="350" width="60" height="180" rx="18"/>
    </g>
  </g>

  <g filter="url(#emboss)">
    <!-- The two r's: white, then the rainbow over it. -->
    <g mask="url(#gap)" fill="none" stroke-width="80">
      <g stroke="#f7f7f9">
        <path d="M312 728 V356 Q312 296 372 296 H458"/>
        <path d="M712 296 V668 Q712 728 652 728 H566"/>
      </g>
      <g stroke="url(#rainbow)" mask="url(#fade)">
        <path d="M312 728 V356 Q312 296 372 296 H458"/>
        <path d="M712 296 V668 Q712 728 652 728 H566"/>
      </g>
    </g>
    <!-- The barbell. -->
    <g fill="#f7f7f9" stroke="#f7f7f9">
      <path d="M236 440 H788" stroke-width="46" stroke-linecap="round" fill="none"/>
      <rect x="176" y="350" width="60" height="180" rx="18" stroke="none"/>
      <rect x="788" y="350" width="60" height="180" rx="18" stroke="none"/>
    </g>
    <g fill="url(#rainbow)" stroke="url(#rainbow)" mask="url(#fade)">
      <path d="M236 440 H788" stroke-width="46" stroke-linecap="round" fill="none"/>
      <rect x="176" y="350" width="60" height="180" rx="18" stroke="none"/>
      <rect x="788" y="350" width="60" height="180" rx="18" stroke="none"/>
    </g>
  </g>
</svg>
